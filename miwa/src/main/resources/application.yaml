spring:
    application:
        name: miwa
    datasource:
        hikari:
            connection-timeout: 10000
            initialization-fail-timeout: -1
        url: jdbc:mysql://127.0.0.1:3306/miwa?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        username: ${DB_USER:root}
        password: ${DB_PASS:kissme}
        driver-class-name: com.mysql.cj.jdbc.Driver
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB

mybatis:
    configuration:
        map-underscore-to-camel-case: true
    type-aliases-package: org.miwa.miwa.entity

server:
    port: 8080
    servlet:
        context-path: /

app:
    admin:
        username: ${ADMIN_USER:admin}
        # BCrypt encoded password, default is "admin123"
        password: ${ADMIN_PASS:{bcrypt}}$2b$10$gKYVELjOpirBw4Ezkp/y..B3mFlb8GPIdAJcavyf5TWKydU6Qu.jS
    jwt:
        secret: ${JWT_SECRET:miwa-jwt-secret-change-in-production}
        expiration: 86400000
    cos:
        secret-id: ${COS_SECRET_ID:}
        secret-key: ${COS_SECRET_KEY:}
        region: ${COS_REGION:ap-guangzhou}
        bucket: ${COS_BUCKET:miwa-1329407407}
        base-url: ${COS_BASE_URL:https://miwa-1329407407.cos.ap-guangzhou.myqcloud.com}
